server {
    listen 8080;
    server_name _;

    root /var/www/html;
    index index.html;

    # Frontend - serve static files directly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API for client writes
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # PMTiles proxy (CORS workaround for build.protomaps.com)
    location /pmtiles/ {
        resolver 8.8.8.8 valid=300s;
        resolver_timeout 5s;
        proxy_pass https://build.protomaps.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host build.protomaps.com;
        proxy_set_header Range $http_range;
        proxy_pass_header Content-Range;
        proxy_pass_header Accept-Ranges;
        proxy_buffering off;
        proxy_cache_bypass 1;
    }

    # ElectricSQL proxy
    location /v1/ {
        proxy_pass http://127.0.0.1:3000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Long timeouts for Electric's long-polling
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
