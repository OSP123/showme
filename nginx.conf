server {
    listen 80;
    server_name _;
    
    root /var/www/html;
    index index.html;

    # Frontend
    # Frontend
    location / {
        proxy_pass http://showme:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Backend API for client writes
    location /api/ {
        # Proxy to the 'api' docker service
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ElectricSQL proxy
    location /v1/ {
        # Proxy to the 'electric' docker service (Electric listens on 3000 by default for HTTP)
        proxy_pass http://electric:3000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Long timeouts for Electric's long-polling
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}